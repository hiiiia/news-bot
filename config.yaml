# news-bot 설정. 소스를 추가/삭제하려면 sources 목록만 고치면 됩니다.
# 새로 추가한 소스는 첫 실행 때 최신 글 N건만 미리보기로 보내고,
# 나머지 기존 글은 "본 것"으로만 기록합니다. 그 다음 실행부터 새 글만 전송합니다.

first_run_preview: 1      # 소스당 미리보기 건수 (0이면 조용히 기록만). 소스별로 덮어쓸 수 있음
first_run_preview_max: 8  # 한 번에 쏟아지지 않게, 첫 실행 전체 미리보기 상한
max_items_per_run: 20     # 한 번에 보낼 최대 건수 (넘치면 다음 실행으로 이월)
fetch_workers: 8          # 소스를 동시에 가져오는 개수

# Claude 편집: 새 글 전체에 중요도(0~10)를 매겨 중요한 것만 골라 한국어로 요약해 보냅니다.
# 기준을 넘는 글이 없으면 아무것도 보내지 않습니다.
# ANTHROPIC_API_KEY 시크릿이 없거나 호출이 실패하면 🚨 긴급 글만 요약 없이 보내고,
# 나머지는 기록하지 않고 다음 실행에서 다시 평가합니다.
summarizer:
  enabled: true
  model: claude-opus-5-5   # 더 가볍게: claude-sonnet-5-5 / claude-haiku-5-5
  min_importance: 7        # 이 점수 이상만 전송 (올리면 더 박해지고, 내리면 더 많이 옴)
  max_picks: 10            # 한 번에 보낼 최대 건수 (넘치면 높은 점수 순, 나머지는 다음 실행)
  max_candidates: 150      # 한 번에 평가할 최대 새 글 수 (넘친 건 다음 실행으로)
  triage_batch: 50         # 평가 API 한 번에 묶을 글 수
  summary_batch: 8         # 요약 API 한 번에 묶을 글 수

# 보안 카테고리 제목에 아래 단어가 있으면 🚨 긴급으로 표시
urgent_keywords:
  - zero-day
  - 0-day
  - actively exploited
  - exploited in the wild
  - remote code execution
  - rce
  - ransomware
  - 제로데이
  - 긴급

# 프리릴리스(alpha/beta/rc/milestone) 제외용 정규식. 아래 릴리스 소스들이 같이 씁니다.
_prerelease: &prerelease
  - '(alpha|beta|rc\d|\d[ab]\d|-M\d)'

# 주소 검증 상태: [확인] = 이 설정을 만들 때 실제로 열어 봄, [미확인] = 열어 보지 못함.
# [미확인] 소스가 실패하면 Actions 로그에 [fail]로 표시됩니다. 다른 소스에는 영향이 없습니다.
sources:
  # ══ 보안: 1차 소스 ══════════════════════════════
  - id: kev
    type: kev
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    limit: 20

  - id: ghsa
    type: ghsa
    limit: 50
    severities: [critical, high]

  - id: nvd
    type: nvd
    lookback_hours: 12     # 스케줄이 몇 시간 밀려도 놓치지 않게 넉넉히 (중복은 기록으로 걸러짐)
    min_cvss: 8.0          # 이 점수 이상만 전송
    urgent_cvss: 9.0       # 이 점수 이상은 🚨

  # ══ 보안: 권고문·연구자·메일링 리스트 ══════════════
  - id: cisa-advisories      # [미확인]
    type: rss
    name: CISA Advisories
    category: security
    limit: 10
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
  - id: paloalto-psirt       # [확인]
    type: rss
    name: Palo Alto Security Advisories
    category: security
    limit: 10
    url: https://security.paloaltonetworks.com/rss.xml
  - id: oss-security         # [확인] 메일링 리스트 — 답장(Re:)은 제외
    type: rss
    name: oss-security
    category: security
    limit: 20
    url: https://seclists.org/rss/oss-sec.rss
    exclude_regex: ['^\s*re:']
  - id: krebs                # [확인]
    type: rss
    name: Krebs on Security
    category: security
    url: https://krebsonsecurity.com/feed/
  - id: project-zero         # [확인: 기존 주소가 이 주소로 이동됨]
    type: rss
    name: Project Zero
    category: security
    url: https://projectzero.google/feed.xml
  - id: thn
    type: rss
    name: The Hacker News
    category: security
    url: https://feeds.feedburner.com/TheHackersNews
  - id: bleeping
    type: rss
    name: BleepingComputer
    category: security
    url: https://www.bleepingcomputer.com/feed/
  - id: securityweek         # [미확인]
    type: rss
    name: SecurityWeek
    category: security
    url: https://feeds.feedburner.com/securityweek

  # ══ 보안: 새로 공개된 PoC 저장소 탐색 ═══════════════
  - id: gh-poc
    type: github_search
    category: security
    since_days: 2
    min_stars: 10
    limit: 10
    queries:
      - 'CVE-2026 in:name,description created:>{since}'

  # ══ 보안: 주요 프로젝트 릴리스 (패치 릴리스 즉시 감지) ══
  - {id: rel-php, type: rss, name: "Release: php-src", title_prefix: PHP, category: security, limit: 5, url: "https://github.com/php/php-src/tags.atom", exclude_regex: *prerelease}
  - {id: rel-openssl, type: rss, name: "Release: openssl", title_prefix: OpenSSL, category: security, limit: 5, url: "https://github.com/openssl/openssl/releases.atom", exclude_regex: *prerelease}
  - {id: rel-nginx, type: rss, name: "Release: nginx", title_prefix: nginx, category: security, limit: 5, url: "https://github.com/nginx/nginx/releases.atom"}
  - {id: rel-curl, type: rss, name: "Release: curl", title_prefix: curl, category: security, limit: 5, url: "https://github.com/curl/curl/releases.atom"}
  - {id: rel-openssh, type: rss, name: "Release: openssh", title_prefix: OpenSSH, category: security, limit: 5, url: "https://github.com/openssh/openssh-portable/tags.atom"}
  - {id: rel-spring-fw, type: rss, name: "Release: Spring Framework", title_prefix: Spring Framework, category: security, limit: 5, url: "https://github.com/spring-projects/spring-framework/releases.atom", exclude_regex: *prerelease}
  - {id: rel-spring-boot, type: rss, name: "Release: Spring Boot", title_prefix: Spring Boot, category: security, limit: 5, url: "https://github.com/spring-projects/spring-boot/releases.atom", exclude_regex: *prerelease}
  - {id: rel-log4j, type: rss, name: "Release: Log4j", title_prefix: Log4j, category: security, limit: 5, url: "https://github.com/apache/logging-log4j2/releases.atom", exclude_regex: *prerelease}
  - {id: rel-tomcat, type: rss, name: "Release: Tomcat", title_prefix: Tomcat, category: security, limit: 5, url: "https://github.com/apache/tomcat/tags.atom", exclude_regex: *prerelease}
  - {id: rel-node, type: rss, name: "Release: Node.js", title_prefix: Node.js, category: security, limit: 5, url: "https://github.com/nodejs/node/releases.atom", exclude_regex: *prerelease}
  - {id: rel-python, type: rss, name: "Release: CPython", title_prefix: Python, category: security, limit: 5, url: "https://github.com/python/cpython/tags.atom", exclude_regex: *prerelease}
  - {id: rel-django, type: rss, name: "Release: Django", title_prefix: Django, category: security, limit: 5, url: "https://github.com/django/django/tags.atom", exclude_regex: *prerelease}
  - {id: rel-redis, type: rss, name: "Release: Redis", title_prefix: Redis, category: security, limit: 5, url: "https://github.com/redis/redis/releases.atom", exclude_regex: *prerelease}
  - {id: rel-moby, type: rss, name: "Release: Docker Engine", title_prefix: Docker, category: security, limit: 5, url: "https://github.com/moby/moby/releases.atom", exclude_regex: *prerelease}
  - {id: rel-linux, type: rss, name: "Release: Linux kernel", title_prefix: Linux, category: security, limit: 5, url: "https://github.com/torvalds/linux/tags.atom", exclude_regex: *prerelease}
  # 아래 둘은 릴리스가 잦지만 Claude가 중요도로 거릅니다
  - {id: rel-fastapi, type: rss, name: "Release: FastAPI", title_prefix: FastAPI, category: security, limit: 5, url: "https://github.com/tiangolo/fastapi/releases.atom", exclude_regex: *prerelease}
  - {id: rel-pydantic, type: rss, name: "Release: Pydantic", title_prefix: Pydantic, category: security, limit: 5, url: "https://github.com/pydantic/pydantic/releases.atom", exclude_regex: *prerelease}

  # ══ IT ═════════════════════════════════════════
  - id: geeknews
    type: rss
    name: GeekNews
    category: it
    url: https://news.hada.io/rss/news
  - id: hn
    type: rss
    name: Hacker News (200점+)
    category: it
    url: https://hnrss.org/newest?points=200
  - id: github-status        # [확인] 장애 이력
    type: rss
    name: GitHub Status
    category: it
    limit: 5
    url: https://www.githubstatus.com/history.atom
  - id: woowahan-tech        # [확인] 국내 기술 블로그
    type: rss
    name: 우아한형제들 기술블로그
    category: it
    limit: 5
    url: https://techblog.woowahan.com/feed/
  - id: kakao-tech           # [확인]
    type: rss
    name: 카카오 기술블로그
    category: it
    limit: 5
    url: https://tech.kakao.com/feed/
  - id: toss-tech            # [확인]
    type: rss
    name: 토스 기술블로그
    category: it
    limit: 5
    url: https://toss.tech/rss.xml

  # ══ AI: 공식 블로그·개인 블로그 ═════════════════════
  - id: openai
    type: rss
    name: OpenAI News
    category: ai
    url: https://openai.com/news/rss.xml
  - id: hf-blog
    type: rss
    name: Hugging Face Blog
    category: ai
    url: https://huggingface.co/blog/feed.xml
  - id: google-ai
    type: rss
    name: Google AI Blog
    category: ai
    url: https://blog.google/technology/ai/rss/
  - id: deepmind             # [확인]
    type: rss
    name: Google DeepMind
    category: ai
    url: https://deepmind.google/blog/rss.xml
  - id: simonw               # [확인] AI 외 글도 섞여 있어 Claude가 거름
    type: rss
    name: Simon Willison
    category: ai
    limit: 10
    url: https://simonwillison.net/atom/everything/

  # ══ AI: 신모델·논문 (Hugging Face API) ══════════════
  - id: hf-trending          # [확인: 응답 필드 확인]
    type: hf_trending
    category: ai
    min_likes: 200           # 좋아요 하한. 너무 많으면 올리세요
    limit: 20
  - id: hf-papers            # [확인: 응답 필드 확인]
    type: hf_papers
    category: ai
    min_upvotes: 20          # 추천 수 하한
    limit: 30

  # ══ AI: 개발 도구 릴리스 ═══════════════════════════
  - {id: rel-claude-code, type: rss, name: "Release: Claude Code", title_prefix: Claude Code, category: ai, limit: 5, url: "https://github.com/anthropics/claude-code/releases.atom", exclude_regex: *prerelease}
  - {id: rel-anthropic-sdk, type: rss, name: "Release: anthropic-sdk-python", title_prefix: anthropic-sdk-python, category: ai, limit: 5, url: "https://github.com/anthropics/anthropic-sdk-python/releases.atom", exclude_regex: *prerelease}
  - {id: rel-mcp-python, type: rss, name: "Release: MCP Python SDK", title_prefix: MCP Python SDK, category: ai, limit: 5, url: "https://github.com/modelcontextprotocol/python-sdk/releases.atom", exclude_regex: *prerelease}
  - {id: rel-ollama, type: rss, name: "Release: Ollama", title_prefix: Ollama, category: ai, limit: 5, url: "https://github.com/ollama/ollama/releases.atom", exclude_regex: *prerelease}
  - {id: rel-vllm, type: rss, name: "Release: vLLM", title_prefix: vLLM, category: ai, limit: 5, url: "https://github.com/vllm-project/vllm/releases.atom", exclude_regex: *prerelease}

  # ══ AI: 탐색형 (에이전트 스킬 · MCP · 신모델 소식) ════
  # 소스를 일일이 지정하지 않고 검색으로 새 항목을 찾습니다.
  # 별 개수·HN 점수 하한으로 스팸을 막고, Claude가 중요도와 [AI-스킬] 라벨을 판단합니다.
  - id: gh-skills
    type: github_search
    category: ai
    since_days: 7          # 최근 7일 안에 만들어진 저장소
    min_stars: 30          # 별 30개 이상
    limit: 15              # 검색어당 최대 건수
    queries:
      - "topic:claude-skills created:>{since}"
      - "topic:agent-skills created:>{since}"
      - "topic:mcp-server created:>{since}"
      - "SKILL.md in:readme created:>{since}"
  - id: hn-ai
    type: hn_search
    category: ai
    lookback_hours: 48
    min_points: 50
    limit: 20
    queries:
      - "agent skills"
      - "SKILL.md"
      - "MCP server"
      - "Claude Code"
      - "LLM benchmark"
      - "open-weight model"
      - "new model release"
      - "Claude"
      - "Gemini"
      - "DeepSeek"
      - "Qwen"
