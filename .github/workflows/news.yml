name: news-bot

on:
  schedule:
    - cron: "23 */6 * * *"   # 6시간 간격(UTC 00·06·12·18시 23분 = 한국 09·15·21·03시 23분). 정각은 GitHub이 붐벼 피함
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 메시지만 보내기"
        type: boolean
        default: false

permissions:
  contents: write   # state/seen.json 커밋용

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python -m bot.main ${{ inputs.test && '--test' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen state"
            git pull --rebase
            git push
          fi
